name: GitShield Security Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build GitShield
        run: go build -o /usr/local/bin/gitshield ./cmd/gitshield

      - name: Execute Security Audit
        run: gitshield scan --fail-on HIGH